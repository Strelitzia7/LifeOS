[package]
name = "lifeos"
version = "0.1.0"
description = "Offline-first daily planning desktop app"
authors = ["LifeOS contributors"]
edition = "2021"

[lib]
name = "lifeos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
